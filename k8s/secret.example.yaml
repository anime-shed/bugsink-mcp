apiVersion: v1
kind: Secret
metadata:
  name: mcp-bugsink-secret
  namespace: mcp
type: Opaque
stringData:
  # Paste your Bugsink user/team API token from Bugsink settings
  BUGSINK_TOKEN: "YOUR_BUGSINK_API_TOKEN_HERE"
  # Optional bearer token required to call the MCP server over HTTP/WS
  MCP_HTTP_AUTH_TOKEN: ""
